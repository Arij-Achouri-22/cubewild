[package]
name = "cubewild"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
fontdue = "0.9.5"
glam = "0.34.3"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
